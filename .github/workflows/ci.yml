name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: wonderhoy-labs/.github/.github/workflows/checks.yml@main

  # The rui command-line tool prepares and checks images on a computer. rui-core, rui-jni and rui-agent are tested
  # here too.
  rust:
    uses: wonderhoy-labs/.github/.github/workflows/rust.yml@main
    with:
      package: rui
      targets: >-
        [
          {"os": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu"},
          {"os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu"},
          {"os": "macos-latest", "target": "aarch64-apple-darwin"},
          {"os": "macos-latest", "target": "x86_64-apple-darwin"}
        ]

  # The app carries rui-jni for every Android ABI, and rui-agent built for 64-bit Arm Linux guests.
  android:
    uses: wonderhoy-labs/.github/.github/workflows/android.yml@main
    with:
      name: rui
      env-prefix: RUI
      rust-targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,aarch64-unknown-linux-musl
    secrets:
      KEYSTORE_BASE64: ${{ secrets.RUI_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.RUI_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.RUI_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.RUI_KEY_PASSWORD }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, rust, android]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: wonderhoy-labs/.github/.github/workflows/release.yml@main
    with:
      title: Rui
