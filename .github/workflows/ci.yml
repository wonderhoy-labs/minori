name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: wonderhoy-labs/.github/.github/workflows/checks.yml@main

  # The minori command-line tool prepares and checks images on a computer. minori-core, minori-jni and minori-agent are tested
  # here too.
  rust:
    uses: wonderhoy-labs/.github/.github/workflows/rust.yml@main
    with:
      package: minori
      targets: >-
        [
          {"os": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu"},
          {"os": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu"},
          {"os": "macos-latest", "target": "aarch64-apple-darwin"},
          {"os": "macos-latest", "target": "x86_64-apple-darwin"}
        ]

  # The app carries minori-jni for every Android ABI, and minori-agent built for 64-bit Arm Linux guests.
  android:
    uses: wonderhoy-labs/.github/.github/workflows/android.yml@main
    with:
      name: minori
      env-prefix: MINORI
      rust-targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,aarch64-unknown-linux-musl
    secrets:
      KEYSTORE_BASE64: ${{ secrets.MINORI_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.MINORI_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.MINORI_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.MINORI_KEY_PASSWORD }}

  # @wonderhoy-labs/minori, the TypeScript library for pages over adb. Minori has no site, so this only tests and packs it.
  web:
    # web.yml's Pages job asks for these even when pages is false, and a run can't start without them.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: wonderhoy-labs/.github/.github/workflows/web.yml@main
    with:
      library: minori
      pages: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, rust, android, web]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: wonderhoy-labs/.github/.github/workflows/release.yml@main
    with:
      title: Minori
