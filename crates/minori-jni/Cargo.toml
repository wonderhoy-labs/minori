[package]
name = "minori-jni"
description = "minori-core's image tools and pseudo-terminals, for Minori's Android app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = "1"
jni = { version = "0.21", default-features = false }
libc = "0.2"
minori-core = { path = "../minori-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Saki's userspace NAT gives guests internet without root. Released library, pinned to its tag.
saki-core = { git = "https://github.com/wonderhoy-labs/saki", tag = "v0.2.0" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
